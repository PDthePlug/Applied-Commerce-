name: Applied Commerce UI/UX audit sweep

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-ui-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_APPLIED_COMMERCE_BACKEND_MODE: local
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Build local-only application
        run: npm run build
      - name: Run six-viewport UI/UX discovery
        run: npx playwright test --config=playwright.audit.config.mjs
      - name: Upload audit evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applied-commerce-uiux-${{ github.sha }}
          path: |
            test-results/ui-audit-report
            test-results/ui-audit-results.json
            test-results/ui-audit-playwright
          if-no-files-found: ignore
          retention-days: 14
